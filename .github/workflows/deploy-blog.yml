name: Deploy Blog to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "blog/**"

permissions:
  contents: read

concurrency:
  group: "deploy-blog-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.151.2"
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v6.1.0
        with:
          path: blog/resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('blog/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build site
        run: hugo --source blog --gc --minify --environment production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: blog/public
          cname: yrizos.com
          commit_message: "Deploy blog: ${{ github.sha }}"
